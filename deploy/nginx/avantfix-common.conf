gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

brotli on;
brotli_comp_level 5;
brotli_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

charset utf-8;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cache-Control $avantfix_cache always;

location = /api/lead {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;

    limit_req zone=leads burst=5 nodelay;
}

location /_a/ {
    access_log off;
}

location ~* \.(?:avif|webp|jpg|jpeg|png|svg|woff2)$ {
    access_log off;
}

location = /robots.txt {
    access_log off;
}

location ~* ^/sitemap.*\.xml$ {
    access_log off;
}

location / {
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;

location = /404.html {
    internal;
}

location ~ /\. {
    deny all;
}
