gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/xml image/svg+xml application/manifest+json;

brotli on;
brotli_comp_level 5;
brotli_types text/plain text/css text/xml application/javascript application/json
             application/xml image/svg+xml application/manifest+json;

limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name avantfix.ru;

    root /var/www/avantfix/belgorod/current;
    index index.html;

    include /etc/nginx/snippets/avantfix-common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name oskol.avantfix.ru;

    root /var/www/avantfix/oskol/current;
    index index.html;

    include /etc/nginx/snippets/avantfix-common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name gubkin.avantfix.ru;

    root /var/www/avantfix/gubkin/current;
    index index.html;

    include /etc/nginx/snippets/avantfix-common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name www.avantfix.ru belgorod.avantfix.ru;

    return 301 https://avantfix.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name avantfix.ru www.avantfix.ru belgorod.avantfix.ru
                oskol.avantfix.ru gubkin.avantfix.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
