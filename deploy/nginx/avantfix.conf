map $uri $avantfix_cache {
    default                                  "public, max-age=0, must-revalidate";
    ~^/_a/                                   "public, max-age=31536000, immutable";
    ~*\.(?:avif|webp|jpg|jpeg|png|svg|woff2)$   "public, max-age=2592000";
    ~^/robots\.txt$                          "public, max-age=3600";
    ~^/sitemap.*\.xml$                       "public, max-age=3600";
}

limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name avantfix.ru;

    root /var/www/avantfix/belgorod/current;
    index index.html;

    include /etc/nginx/snippets/avantfix-common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name staryj-oskol.avantfix.ru;

    root /var/www/avantfix/oskol/current;
    index index.html;

    include /etc/nginx/snippets/avantfix-common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name gubkin.avantfix.ru;

    root /var/www/avantfix/gubkin/current;
    index index.html;

    include /etc/nginx/snippets/avantfix-common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/avantfix-tls.conf;
    server_name www.avantfix.ru belgorod.avantfix.ru;

    return 301 https://avantfix.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name avantfix.ru www.avantfix.ru belgorod.avantfix.ru
                staryj-oskol.avantfix.ru gubkin.avantfix.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
